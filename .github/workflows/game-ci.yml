name: Game CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

defaults:
  run:
    working-directory: game

jobs:
  checks:
    name: Type, lint, content, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: game/.nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate:content
      - run: npm test
      - run: npm run build

  browser:
    name: Playwright (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, workbench]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: game/.nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.suite }} baseline
        run: npm run test:${{ matrix.suite }} -- --reporter=list,html --workers=1 --fail-on-flaky-tests
      - name: Upload ${{ matrix.suite }} report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            game/playwright-report/
            game/test-results/
          if-no-files-found: ignore
          retention-days: 14
